services:
  - type: web
    name: exposicion-calculadora
    runtime: python
    buildCommand: "pip install -r requirements.txt && cd proyecto_suma && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "cd proyecto_suma && gunicorn proyecto_suma.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0