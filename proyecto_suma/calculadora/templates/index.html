<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Django - Ingreso</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 320px;
      text-align: center;
    }
    h2 { color: #2c3e50; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .btn {
      background-color: #2da44e;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
    }
    .btn:hover { background-color: #2c974b; }
    .btn-multimedia {
      display: block;
      background-color: #0366d6;
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      margin-top: 15px;
      box-sizing: border-box;
    }
    .btn-multimedia:hover { background-color: #024ea4; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Calculadora Django</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="input-group">
        <label for="num1">Primer Número:</label>
        <input type="number" id="num1" name="num1" placeholder="Ej: 25" required>
      </div>

      <div class="input-group">
        <label for="num2">Segundo Número:</label>
        <input type="number" id="num2" name="num2" placeholder="Ej: 75" required>
      </div>

      <button type="submit" class="btn">Calcular y Guardar Suma</button>
    </form>

    <!-- Botón que redirige a la nueva página multimedia -->
    <a href="{% url 'multimedia' %}" class="btn-multimedia">✨ Ver Sección Multimedia y 3D</a>
  </div>

</body>
</html>
