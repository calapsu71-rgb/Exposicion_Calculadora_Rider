<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Interactiva</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 320px;
      text-align: center;
    }
    h2 { color: #2c3e50; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .btn {
      background-color: #2da44e;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
    }
    .btn:hover { background-color: #2c974b; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Calculadora</h2>
    
    <div class="input-group">
      <label for="num1">Número 1:</label>
      <input type="number" id="num1" placeholder="Ej: 20">
    </div>

    <div class="input-group">
      <label for="num2">Número 2:</label>
      <input type="number" id="num2" placeholder="Ej: 30">
    </div>

    <button type="button" id="btnSumar" class="btn">Calcular Suma</button>
  </div>

  <script>
    document.getElementById('btnSumar').addEventListener('click', function() {
      const num1 = parseFloat(document.getElementById('num1').value) || 0;
      const num2 = parseFloat(document.getElementById('num2').value) || 0;
      
      const suma = num1 + num2;

      // Guarda el resultado en el navegador
      localStorage.setItem('resultadoSuma', suma);

      // Redirige a la página de resultados
      window.location.href = 'resultado.html';
    });
  </script>

</body>
</html>
