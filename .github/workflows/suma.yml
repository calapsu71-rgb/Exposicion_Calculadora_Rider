name: Automatizacion de Suma

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Permiso obligatorio para que el robot pueda modificar y guardar archivos
permissions:
  contents: write

jobs:
  ejecutar-suma:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script de suma en la raíz
        run: |
          python sumar.py

      - name: Guardar y subir el nuevo resultado.txt al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add resultado.txt
          git diff --staged --quiet || git commit -m "Actualización automática de resultado.txt via GitHub Actions"
          git push