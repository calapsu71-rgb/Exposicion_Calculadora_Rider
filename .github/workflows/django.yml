name: Django Continuous Integration & Deploy

on:
  push:
    branches:
      - main

# Permisos necesarios para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Django
        run: |
          python -m pip install --upgrade pip
          pip install django
        working-directory: proyecto_suma

      - name: Ejecutar pruebas de Django
        run: |
          python manage.py test
        working-directory: proyecto_suma

      - name: Ejecutar script de suma (Actualiza resultado.txt)
        run: |
          python sumar.py

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Sube todo el proyecto ya con el resultado.txt actualizado en caliente
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4